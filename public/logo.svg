<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <defs>
    <linearGradient id="logo-shield-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1890ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#096dd9;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Shield Background -->
  <path d="M100 20 L170 40 L170 100 C170 145 100 200 100 200 C100 200 30 145 30 100 L30 40 Z" 
        fill="url(#logo-shield-gradient)" 
        stroke="#0050b3" 
        stroke-width="4"
        filter="url(#shadow)"/>
  
  <!-- Heart Symbol -->
  <path d="M100 160 C100 160 140 125 140 95 C140 80 130 70 115 70 C105 70 100 80 100 80 C100 80 95 70 85 70 C70 70 60 80 60 95 C60 125 100 160 100 160 Z"
        fill="white"
        opacity="0.95"/>
  
  <!-- Highlight Effect -->
  <ellipse cx="65" cy="60" rx="25" ry="15" fill="white" opacity="0.2"/>
  
  <!-- Text -->
  <text x="100" y="225" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1890ff" text-anchor="middle">Insurance CRM Pro</text>
</svg>